[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:run]
branch = True
source = service
omit = 
    */__main__.py
    */venv/*
    */virtualenv/*

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:

[flake8]
max-line-length = 127
max-complexity = 10
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist
ignore = E203, W503

[pylint]
max-line-length = 127
disable = 
    C0111,
    R0903,
    C0103,
    W0703

[pylint.MESSAGES CONTROL]
disable = C0111, R0903, C0103, W0703
